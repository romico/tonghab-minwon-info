# 멀티 플랫폼 포터블 ZIP 빌드 (Windows / Linux / macOS)
# - Ubuntu에서 각 OS용 Node 런타임을 번들
# - tag(v*) push 시 GitHub Release 자동 게시 + update.json 배포
name: Portable Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: portable-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build portable ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled Node runtimes
        uses: actions/cache@v4
        with:
          path: .cache
          key: node-portable-${{ hashFiles('scripts/build-release.mjs') }}-22.18.0
          restore-keys: |
            node-portable-

      - name: Build all portable packages
        run: npm run release:all
        env:
          CI: "true"

      - name: Read package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh tonghab-minwon-info-*-portable-v${VERSION}.zip update.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tonghab-minwon-info-portable-v${{ steps.meta.outputs.version }}
          path: |
            tonghab-minwon-info-windows-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-linux-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-macos-arm64-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-macos-x64-portable-v${{ steps.meta.outputs.version }}.zip
            update.json
            update.ini
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tonghab-minwon-info-windows-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-linux-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-macos-arm64-portable-v${{ steps.meta.outputs.version }}.zip
            tonghab-minwon-info-macos-x64-portable-v${{ steps.meta.outputs.version }}.zip
            update.json
            update.ini
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy update.json to Cloudflare Pages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ccb4121a1bcbdea92453f10d67fd4bc9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 시크릿이 없어 Pages 배포를 건너뜁니다."
            exit 0
          fi
          npm run deploy:update-feed
